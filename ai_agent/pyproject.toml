# Tool configuration only. Dependencies are pinned in requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["orbit_agent", "scripts", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters as call expressions in defaults.
extend-immutable-calls = ["fastapi.Query"]
